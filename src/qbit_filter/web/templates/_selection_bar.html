<div id="selection-bar" class="selection-bar" data-active="false">
  <div class="info">
    Selected <strong id="sel-count">0</strong> torrents
    (<span id="sel-size">0</span> GB)
  </div>
  <div class="actions">
    <button id="sel-invert" class="btn" type="button" title="Invert selection (i)">Invert</button>
    <button id="sel-losers" class="btn" type="button" title="Select all rule-flagged torrents (a)">All losers</button>
    <button id="sel-clear" class="btn" type="button">Clear</button>
    <button id="sel-delete" class="btn btn-danger" data-purge="false">Delete (keep files)</button>
    <button id="sel-purge"  class="btn btn-danger" data-purge="true">Delete + purge files</button>
  </div>
</div>
